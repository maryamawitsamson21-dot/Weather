<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <title>Today's Weather</title>
    <img src="https://img.magnific.com/free-psd/3d-icon-weather-conditions-with-rain-sun_23-2150108737.jpg" alt="3D Weather Icon with Rain and Sun" class="weather-icon">

</head>
<!-- STEP 1: Added 'flex flex-col min-h-screen' to make the body a full-screen vertical container -->
<body class="relative w-full min-h-screen flex flex-col overflow-x-hidden text-slate-800">

    <!-- Blurred Background Layer (Keeps the background responsive behind the content) -->
    <div class="absolute inset-0 bg-[url('https://t4.ftcdn.net/jpg/07/16/79/07/240_F_716790744_qomwHLlgsDPQIjLN72m8WMv9dSJ0zUYR.jpg')] bg-cover bg-center blur-md scale-105 -z-10"></div>

    <!-- STEP 2: Changed the main container wrapper to a <main> tag and added 'flex-grow' -->
    <!-- This section stretches to absorb all extra space, pushing the footer down -->
    <main class="flex-grow flex items-center flex-col space-y-4 mt-8 relative z-10"> 
        <div class="flex items-center gap-2"> 
            <input class="bg-purple-300 text-white placeholder-white/70 px-4 py-2 rounded-lg outline-none" id="input" type="text" placeholder="Enter City"> 
            <img id="img" class="w-8 cursor-pointer" src="img.png/search_9373594.png" alt="search image"> 
        </div> 
        <div> 
            <p class="font-bold" id="date"></p> 
        </div> 
        <h1 class="font-bold text-2xl" id="cityhtml"></h1> 
        <div>
            <img class="w-32" id="type" src="" alt="">
        </div> 
        <div>
            <p class="font-bold text-3xl" id="deg"></p>
        </div> 
        <div class="flex gap-32 bg-white/20 backdrop-blur-sm p-4 rounded-xl"> 
            <div>
                <div>Highs</div>
                <div class="font-bold" id="high"></div>
            </div> 
            <div>
                <div>Lows</div> 
                <div class="font-bold" id="lows"></div>
            </div> 
        </div> 
    </main>

    <!-- STEP 3: The footer sits comfortably outside the main block at the absolute bottom -->
    <footer class="relative z-10 w-full py-4 bg-black/20 backdrop-blur-md text-center text-white text-sm">
        <p>© 2026 Weather App. All rights reserved.</p>
    </footer> 

    <script type="module" src="weather.js"></script>
</body>
</html>
