<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <meta charset="UTF-8">
    <title>Today's Weather</title>
</head>
<body class="relative w-full min-h-screen flex flex-col overflow-x-hidden text-gray-800 font-sans">

    <!-- 1. Pure Tailwind Blurred Background Layer -->
    <!-- (We use inline style just for the raw URL string so Tailwind v2 doesn't break) -->
    <div class="absolute inset-0 bg-cover bg-center filter blur-md transform scale-105" 
         style="z-index: -10; background-image: url('https://ftcdn.net');">
    </div>

    <!-- 2. Sharp Content Layer -->
    <main class="flex-grow flex items-center flex-col mt-12 relative" style="z-index: 10;">
        
        <!-- Search Input Bar Area -->
        <div class="flex items-center space-x-2 bg-purple-500 bg-opacity-80 p-2 rounded-lg shadow-md">
            <input class="bg-transparent text-white placeholder-white outline-none px-2 w-48 text-sm" id="input" type="text" placeholder="Enter City">
            <!-- White search icon hosted on a public mirror -->
            <img id="img" class="w-6 h-6 cursor-pointer filter invert" src="https://icons8.com" alt="search image">
        </div>
        
        <!-- Date Display Container -->
        <div class="mt-6">
            <p class="font-bold text-gray-700 bg-white bg-opacity-40 px-4 py-1 rounded-full text-xs tracking-wider" id="date"></p>
        </div>
        
        <!-- City Header Name -->
        <h1 class="text-4xl font-extrabold mt-4 text-gray-900 tracking-wide" id="cityhtml"></h1>
        
        <!-- Condition Weather Icon Space -->
        <div class="my-4">
            <img class="w-32 h-32 object-contain" id="type" src="" alt="">
        </div>
        
        <!-- Temperature Metric -->
        <div class="mb-6">
            <p class="text-6xl font-black text-gray-900" id="deg"></p>
        </div>
        
        <!-- Temperature Min/Max Spread Card -->
        <div class="flex space-x-12 bg-white bg-opacity-30 border border-white p-5 rounded-2xl shadow-lg filter backdrop-blur-sm">
            <div class="text-center">
                <div class="text-xs uppercase tracking-wider text-gray-600 font-bold">Highs</div>
                <div class="font-black text-2xl text-red-600 mt-1" id="high"></div>
            </div>
            
            <!-- Visual Divider Line -->
            <div class="w-px bg-gray-400 opacity-30 self-stretch"></div>
            
            <div class="text-center">
                <div class="text-xs uppercase tracking-wider text-gray-600 font-bold">Lows</div> 
                <div class="font-black text-2xl text-blue-600 mt-1" id="lows"></div>
            </div>
        </div>
    </main>

    <!-- 3. The Footer Layer Sticky at Bottom -->
    <footer class="w-full py-4 bg-gray-900 bg-opacity-80 text-center text-white text-xs tracking-wide" style="position: relative; z-index: 10;">
        <p>© 2026 Weather App. All rights reserved.</p>
    </footer>

    <script type="module" src="weather.js"></script>
</body>
</html>
