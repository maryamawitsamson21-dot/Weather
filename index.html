<!DOCTYPE html>
<html>
<head>
    <!-- Fixed Tailwind CDN Link via cny/unpkg/cdnjs system -->
    <script src="https://unpkg.com@^2/dist/tailwind.min.js"></script>
    <meta charset="UTF-8">
    <title>Today's Weather</title>
</head>
<body class="relative w-full min-h-screen flex flex-col overflow-x-hidden text-black">

    <!-- 1. Blurred Background Layer -->
    <div class="absolute inset-0 bg-[url('https://ftcdn.net')] bg-cover bg-center filter blur-sm transform scale-105" style="z-index: -10;"></div>

    <!-- 2. Sharp Content Layer -->
    <main class="flex-grow flex items-center flex-col space-y-4 mt-8" style="position: relative; z-index: 10;">
        <div class="flex items-center gap-2">
            <input class="bg-purple-300 text-white placeholder-white p-2 rounded-lg outline-none" id="input" type="text" placeholder="Enter City">
            
            <!-- Fixed search image with an online fall-back icon -->
            <img id="img" class="w-8 cursor-pointer" src="https://icons8.com" alt="search image">
        </div>
        
        <div>
            <p class="font-bold" id="date"></p>
        </div>
        
        <h1 class="text-3xl font-bold" id="cityhtml"></h1>
        
        <div>
            <img class="w-32" id="type" src="" alt="">
        </div>
        
        <div>
            <p class="text-4xl font-bold" id="deg"></p>
        </div>
        
        <div class="flex gap-16 bg-white bg-opacity-20 p-4 rounded-xl shadow-sm">
            <div>
                <div class="text-sm opacity-80">Highs</div>
                <div class="font-bold text-lg" id="high"></div>
            </div>
            <div>
                <div class="text-sm opacity-80">Lows</div> 
                <div class="font-bold text-lg" id="lows"></div>
            </div>
        </div>
    </main>

    <!-- 3. The Footer Layer -->
    <footer class="w-full py-4 bg-black bg-opacity-20 text-center text-white text-sm" style="position: relative; z-index: 10;">
        <p>© 2026 Weather App. All rights reserved.</p>
    </footer>

    <script type="module" src="weather.js"></script>
</body>
</html>
