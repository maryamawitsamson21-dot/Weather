<!DOCTYPE html>
<html>
<head>
    <!-- The official Tailwind CDN script -->
    <script src="https://tailwindcss.com"></script>
    <meta charset="UTF-8">
    <title>Today's Weather</title>
</head>
<body class="relative w-full min-h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- 1. Blurred Background Layer -->
    <div class="absolute inset-0 bg-cover bg-center blur-md scale-105 -z-10" 
         style="background-image: url('https://t4.ftcdn.net/jpg/07/16/79/07/240_F_716790744_qomwHLlgsDPQIjLN72m8WMv9dSJ0zUYR.jpg');">
    </div>

    <!-- 2. Sharp Content Layer (flex-grow expands this section to push the footer down) -->
    <main class="flex-grow flex items-center flex-col space-y-4 mt-8 relative z-10">
        <div class="flex items-center gap-2">
            <!-- Your original input with a padding fix -->
            <input class="bg-purple-300 text-white placeholder-white/70 px-4 py-2 rounded-lg outline-none" id="input" type="text" placeholder="Enter City">
            <!-- Your original search image path -->
            <img id="img" class="w-8" src="img.png/search_9373594.png" alt="search image">
        </div>
        
        <div>
            <p class="font-bold" id="date"></p>
        </div>
        
        <h1 class="font-bold text-2xl" id="cityhtml"></h1>
        
        <div>
            <img class="w-32" id="type" src="" alt="">
        </div>
        
        <div>
            <p class="font-bold text-3xl" id="deg"></p>
        </div>
        
        <!-- Your original layout with a transparent backdrop so it looks beautiful -->
        <div class="flex gap-32 bg-white/20 backdrop-blur-sm p-4 rounded-xl">
            <div>
                <div>Highs</div>
                <div class="font-bold" id="high"></div>
            </div>
            <div>
                <div>Lows</div> 
                <div class="font-bold" id="lows"></div>
            </div>
        </div>
    </main>

    <!-- 3. The Footer Layer (Stays perfectly at the bottom) -->
    <footer class="relative z-10 w-full py-4 bg-black/20 backdrop-blur-md text-center text-white text-sm">
        <p>© 2026 Weather App. All rights reserved.</p>
    </footer>

    <script type="module" src="weather.js"></script>
</body>
</html>
